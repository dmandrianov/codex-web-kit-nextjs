<svg width="1200" height="470" viewBox="0 0 1200 470" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Как работает Web Kit</title>
  <desc id="desc">Вы описываете задачу, Web Kit смотрит состояние проекта, а Codex предлагает один следующий проверяемый шаг.</desc>

  <defs>
    <linearGradient id="background" x1="90" y1="0" x2="1100" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111522"/>
      <stop offset="1" stop-color="#090B11"/>
    </linearGradient>
    <linearGradient id="accent" x1="80" y1="60" x2="1110" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9E91FF"/>
      <stop offset="0.52" stop-color="#7C6CF2"/>
      <stop offset="1" stop-color="#63D7B4"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="470" rx="28" fill="url(#background)"/>
  <circle cx="1110" cy="36" r="150" fill="#7666EC" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="72" cy="448" r="130" fill="#4FD0AA" fill-opacity="0.12" filter="url(#glow)"/>

  <rect x="64" y="46" width="224" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08"/>
  <circle cx="83" cy="62" r="5" fill="#63D7B4"/>
  <text x="98" y="67" fill="#D8DCE8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">WEB KIT / CODEX + NEXT.JS</text>

  <text x="64" y="130" fill="#F7F8FC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="750" letter-spacing="-1.4">Из обычного сообщения —</text>
  <text x="64" y="181" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="750" letter-spacing="-1.4">в следующий проверяемый шаг</text>

  <g filter="url(#shadow)">
    <rect x="64" y="238" width="320" height="164" rx="20" fill="#171B28" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <rect x="440" y="238" width="320" height="164" rx="20" fill="#1A1D2E" stroke="#8F81FF" stroke-opacity="0.45"/>
    <rect x="816" y="238" width="320" height="164" rx="20" fill="#171B28" stroke="#FFFFFF" stroke-opacity="0.10"/>
  </g>

  <rect x="88" y="262" width="64" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="104" y="279" fill="#AEB5C8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">01 / ВЫ</text>
  <text x="88" y="324" fill="#F7F8FC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700">Пишете как обычно</text>
  <text x="88" y="354" fill="#AEB5C8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">«Хочу сайт для сервиса.</text>
  <text x="88" y="377" fill="#AEB5C8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">С чего лучше начать?»</text>

  <rect x="464" y="262" width="104" height="24" rx="12" fill="#8F81FF" fill-opacity="0.16"/>
  <text x="480" y="279" fill="#BEB6FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">02 / WEB KIT</text>
  <text x="464" y="324" fill="#F7F8FC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700">Смотрит на проект</text>
  <text x="464" y="354" fill="#AEB5C8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Материалы · готовые файлы</text>
  <text x="464" y="377" fill="#AEB5C8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">решения · текущий этап</text>

  <rect x="840" y="262" width="90" height="24" rx="12" fill="#63D7B4" fill-opacity="0.13"/>
  <text x="856" y="279" fill="#8EE5CA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">03 / CODEX</text>
  <text x="840" y="324" fill="#F7F8FC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700">Предлагает один шаг</text>
  <text x="840" y="354" fill="#AEB5C8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Понятный результат, проверка</text>
  <text x="840" y="377" fill="#AEB5C8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">и продолжение без догадок</text>

  <path d="M396 320H423" stroke="#8F81FF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M417 313L424 320L417 327" stroke="#8F81FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M772 320H799" stroke="#63D7B4" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M793 313L800 320L793 327" stroke="#63D7B4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="64" y="442" fill="#6F778D" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650" letter-spacing="0.8">ОДИН ЭТАП · ПОНЯТНЫЙ РЕЗУЛЬТАТ · СЛЕДУЮЩИЙ ШАГ</text>
</svg>
